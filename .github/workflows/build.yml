name: C/C++ CI

on: push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: build in devcontainer
        uses: devcontainers/ci@v0.3
        with: 
          runCmd: cmake -B build -S . && cmake --build build && cmake --build build --target package
      - name: upload
        uses: actions/upload-artifact@v4
        with:
            name: build 
            path: build/*.zip
