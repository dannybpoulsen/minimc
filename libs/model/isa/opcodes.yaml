Cast:
  trunc:
    opcode: Trunc
    params:
      - name: res
        type: t1
      - name: op1
        type: t2
    types:
      t1:
        - Integer
      t2:
        - Integer
    size_constraints: BW(t2) >= BW(t1)
    vm: False
    assign_convertible: True
    
  bitcast:
    opcode: BitCast
    params:
      - name: res
        type: t1
      - name: op1
        type: t2
    types:
      t1:
        - Integer
      t2:
        - Integer
    vm: True
    size_constraints: BW(t2) == BW(t1)
    
    
  zext:
    opcode: ZExt
    params:
      - name: res
        type: t1
      - name: op1
        type: t2
    types:
      t1:
        - Integer
      t2:
        - Integer
