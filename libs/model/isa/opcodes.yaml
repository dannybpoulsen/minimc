  inttoptr:
    opcode: IntToPtr
    params:
      - name: res
        type: t1
      - name: op1
        type: t2
    types:
      t2:
        - Integer
      t1:
        - Pointer
    vm: False
    assign_convertible: True
    
  BoolZExt:
    opcode: BoolZExt
    params:
      - name: res
        type: t1
      - name: op1
        type: t2
    types:
      t1:
        - Integer
      t2:
        - Bool
    vm: False
    template_construction:
      auto tup = std::make_tuple (args...);
      return make<MiniMC::Model::InstructionCode::ZExt> (std::get<0>(tup),std::get<1> (tup));
       
  BoolSExt:
