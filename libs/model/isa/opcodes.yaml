        - Bool
    vm: False
    assign_convertible: True

    
Memory:
  store:
    opcode: Store
    params:
      - name: res
        type: t3
      - name: storeto
        type: t3
      - name: addr
        type: t1
      - name: storee
        type: t2
    types:
      t1:
        - Pointer
      t2:
        - Any
      t3:
        - Memory
    vm: False
    assign_convertible: True
    template_construction:
      auto tup = std::make_tuple (args...);
      auto expr = std::make_shared<MiniMC::Model::StoreExpr> (std::get<1>(tup),std::get<2>(tup),std::get<3>(tup));
      return make<VMInstructionCode::Assign> (std::get<0>(tup),expr);
  load:
    opcode: Load
    params:
      - name: res
        type: t1
      - name: memory
        type: t3 
      - name: addr
        type: t2
    types:
      t1:
        - Any
      t2:
        - Pointer
      t3:
        - Memory
    vm: False
    assign_convertible: True
    template_construction:
      auto tup = std::make_tuple (args...);
      auto expr = std::make_shared<MiniMC::Model::LoadExpr> (std::get<1>(tup),std::get<2>(tup),std::get<0>(tup)->getType());
      return make<VMInstructionCode::Assign> (std::get<0>(tup),expr);
    replace_construction:
      Value_ptr operator() (LoadExpr&  expr) const  {
      return std::make_shared<LoadExpr> (Replace(expr.mem()),Replace(expr.addr()),expr.getToType());
      }
      
Internal:
  skip:
    opcode: Skip
    params:  []
    vm: True
      
  call:
    opcode: Call
    params:
      - name: res
        type: t1
      - name: function
        type: t2
      - name: "params*"
        type: t3
    types:
      t1:
        - Any
      t2:
        - Pointer
      t3:
        - Vector
    vm: True
    
  assign:
    opcode: Assign
    params:
      - name: res
        type: t1
      - name: op1
        type: t1
    types:
      t1:
        - Any
    vm: True
    
  nondet:
    opcode: NonDet
    params:
      - name: res
        type: t1
      - name: min
        type: t1
      - name: max
        type: t1
    types:
      t1:
        - Integer
    vm: True
    
  uniform:
    opcode: Uniform
    params:
      - name: res
        type: t1
      - name: min
        type: t1
      - name: max
        type: t1
    types:
      t1:
        - Integer
    vm: True
    
  ret:
    opcode: Ret
    params:
      - name: value
        type: t1
    types:
      t1:
        - Any
    vm: True
    
  retvoid:
    opcode: RetVoid
    params: []
    vm: True
    
AssertAssume:
  assert:
    opcode: Assert
    params:
      - name: expr
        type: t1
    types:
      t1:
        - Bool
    vm: True
    
  assume:
    opcode: Assume
    params:
      - name: expr
        type: t1
    types:
      t1:
        - Bool
    vm: True
    
  negassume:
    opcode: NegAssume
    params:
      - name: expr
        type: t1
    types:
      t1:
        - Bool
    template_construction:
      auto tup = std::make_tuple (args...);
      auto expr = std::make_shared<MiniMC::Model::LogNotExpr> (std::get<0> (tup));
      return make<VMInstructionCode::Assume> (expr);
      
